<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDC Placement Portal</title>
    <script>
      // Pairs with public/404.html: if we arrived here via the 404 redirect
      // trick, restore the originally-requested path before the app mounts.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          var basePath = '/CDC-Project/';
          window.history.replaceState(null, '', basePath + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
